name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: fleetflow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fleetflow
          POSTGRES_PASSWORD: fleetflow_dev
          POSTGRES_DB: fleetflow
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U fleetflow -d fleetflow"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://fleetflow:fleetflow_dev@localhost:5433/fleetflow
      REDIS_URL: redis://localhost:6380
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      ADMIN_EMAIL: admin@fleetflow.test
      ADMIN_PASSWORD: ci-only-admin-password-12345
      WEB_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run infra:typecheck
      - run: npm run test:aws-event -w @fleetflow/api
      - name: Build API container
        run: docker build -f apps/api/Dockerfile -t fleetflow-api:ci .
      - name: Build web container
        run: docker build -f apps/web/Dockerfile -t fleetflow-web:ci .
      - run: npm run db:migrate -w @fleetflow/api
      - run: npm run seed:admin -w @fleetflow/api
      - name: Run integration smoke test
        run: |
          npm run dev:api > /tmp/fleetflow-api.log 2>&1 &
          npm run dev:worker > /tmp/fleetflow-worker.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/health > /dev/null; then break; fi
            sleep 1
          done
          npm run test:smoke

  deploy:
    name: Deploy to AWS
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: npm ci
      - name: Check AWS role configuration
        env:
          DEPLOY_ROLE_ARN: ${{ vars.FLEETFLOW_AWS_ROLE_ARN }}
        run: test -n "$DEPLOY_ROLE_ARN" || { echo 'Set repository variable FLEETFLOW_AWS_ROLE_ARN first'; exit 1; }
      - name: Use short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.FLEETFLOW_AWS_ROLE_ARN }}
          aws-region: ap-south-2
      - name: Read the live stack settings
        shell: bash
        run: |
          set -euo pipefail
          account=$(aws sts get-caller-identity --query Account --output text)
          test "$account" = '213470585464'
          admin_email=$(aws cloudformation describe-stacks --stack-name FleetFlow --query "Stacks[0].Outputs[?OutputKey=='AdminEmail'].OutputValue | [0]" --output text)
          distribution_id=$(aws cloudformation list-stack-resources --stack-name FleetFlow --query "StackResourceSummaries[?ResourceType=='AWS::CloudFront::Distribution'].PhysicalResourceId | [0]" --output text)
          distribution=$(aws cloudfront get-distribution-config --id "$distribution_id")
          domain=$(jq -r '.DistributionConfig.Aliases.Items[0] // empty' <<< "$distribution")
          certificate=$(jq -r '.DistributionConfig.ViewerCertificate.ACMCertificateArn // empty' <<< "$distribution")
          test "$admin_email" != None && test -n "$admin_email"
          test "$domain" = 'fleetflow.prudhvik.me'
          [[ "$certificate" == arn:aws:acm:us-east-1:213470585464:certificate/* ]]
          echo "FLEETFLOW_ADMIN_EMAIL=$admin_email" >> "$GITHUB_ENV"
          echo "FLEETFLOW_DOMAIN=$domain" >> "$GITHUB_ENV"
          echo "FLEETFLOW_CERTIFICATE_ARN=$certificate" >> "$GITHUB_ENV"
      - name: Deploy FleetFlow
        shell: bash
        run: |
          npx cdk deploy FleetFlow --require-approval never \
            -c "adminEmail=$FLEETFLOW_ADMIN_EMAIL" \
            -c "customDomainName=$FLEETFLOW_DOMAIN" \
            -c "customDomainCertificateArn=$FLEETFLOW_CERTIFICATE_ARN"
      - name: Check live readiness
        run: curl --fail --silent --show-error --retry 10 --retry-delay 15 --retry-all-errors https://fleetflow.prudhvik.me/api/ready
